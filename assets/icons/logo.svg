<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer hexagonal cluster geometry -->
  <polygon points="16,2 29,9.5 29,22.5 16,30 3,22.5 3,9.5" stroke="#3b82f6" stroke-width="2.2" fill="rgba(59, 130, 246, 0.1)"/>
  <!-- Central interconnected cluster nodes -->
  <circle cx="16" cy="16" r="3.2" fill="#06b6d4" stroke="#06b6d4"/>
  <circle cx="9" cy="11" r="2.2" fill="#3b82f6" stroke="#3b82f6"/>
  <circle cx="23" cy="11" r="2.2" fill="#3b82f6" stroke="#3b82f6"/>
  <circle cx="9" cy="21" r="2.2" fill="#3b82f6" stroke="#3b82f6"/>
  <circle cx="23" cy="21" r="2.2" fill="#3b82f6" stroke="#3b82f6"/>
  <!-- Connecting network edges -->
  <line x1="16" y1="16" x2="9" y2="11" stroke="#38bdf8" stroke-width="1.6"/>
  <line x1="16" y1="16" x2="23" y2="11" stroke="#38bdf8" stroke-width="1.6"/>
  <line x1="16" y1="16" x2="9" y2="21" stroke="#38bdf8" stroke-width="1.6"/>
  <line x1="16" y1="16" x2="23" y2="21" stroke="#38bdf8" stroke-width="1.6"/>
  <!-- Log lines in background -->
  <line x1="12" y1="8" x2="20" y2="8" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="1 1"/>
  <line x1="12" y1="24" x2="20" y2="24" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="1 1"/>
</svg>
